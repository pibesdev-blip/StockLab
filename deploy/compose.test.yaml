# StockLab en TEST (PibesDev). Usar siempre a través de deploy/deploy.sh:
#   docker compose -p ${SLUG}-test -f deploy/compose.test.yaml --env-file deploy/server.env ...
name: ${SLUG}-test

services:
  api:
    image: ${SLUG}-api:${APP_VERSION}
    pull_policy: never
    env_file:
      - app.env
      - ${SECRETS_FILE}
    environment:
      NODE_ENV: production
      PORT: "3000"
      TRUST_PROXY: ${APP_GATEWAY}
    ports:
      - "127.0.0.1:${PORT_API}:3000"
    networks:
      default:
        gw_priority: 1
      db: {}
    restart: always
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  default:
    ipam:
      config:
        - subnet: ${APP_SUBNET}
          gateway: ${APP_GATEWAY}
  db:
    external: true
    name: infrastructure-db
